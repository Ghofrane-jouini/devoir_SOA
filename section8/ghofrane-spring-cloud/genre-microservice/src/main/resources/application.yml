server:
  port: 8082

spring:
  application:
    name: genre
  profiles:
    active: "prod"
  config:
  # import: "optional:configserver:http://localhost:9999/"
  datasource:
    url: 'jdbc:mysql://mysqldb:3306/test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true'
    username: root
    password: root
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false

eureka:
  client:
    enabled: false
    service-url:
      defaultZone: 'http://localhost:8761/eureka/'
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: '*'

build:
  version: 2.0

author:
  name: "Ghofrane [Genre PROD]"
  email: "ghofrane_genre_prod@gmail.com"