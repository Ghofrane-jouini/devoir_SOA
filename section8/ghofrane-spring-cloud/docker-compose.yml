services:
  mysqldb:
    image: mysql
    container_name: mysqldb
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test

  genre-ms:
    build: ./genre-microservice
    container_name: genre-ms
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysqldb:3306/test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      mysqldb:
        condition: service_healthy